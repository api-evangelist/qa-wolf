name: QA Wolf
description: >-
  QA Wolf is a hybrid platform and service that takes QA off software teams'
  plates: AI maps an application's user journeys, converts plain-language prompts
  into Playwright and Appium tests, and runs those flows in massively parallel
  cloud infrastructure across web, iOS, and Android. Alongside the platform QA
  Wolf offers coverage-as-a-service staffed by dedicated QA engineers. For
  developers it ships a first-party TypeScript toolchain — the qawolf CLI, a CI
  SDK, and the @qawolf/flows, @qawolf/emails, @qawolf/testkit, and @qawolf/pom
  libraries — plus a small v0 REST API and CI webhooks for triggering runs and
  gating deployment pipelines. This profile was enriched by the API Evangelist
  pipeline from QA Wolf's public developer surface.
